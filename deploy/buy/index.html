<meta charset="utf-8">

<title>购买额度 · 灵驿</title>
<style>
:root{--bg:#0a0e17;--card:#111827;--line:#1f2a3c;--text:#e6edf6;--muted:#8b98ad;--accent:#22d3ee;--accent2:#a78bfa}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,rgba(34,211,238,.12),transparent),var(--bg);color:var(--text);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
header img{width:40px;height:40px;border-radius:10px}
header b{font-size:20px;letter-spacing:.5px}
header a{margin-left:auto;color:var(--accent);text-decoration:none;font-size:14px}
h1{font-size:26px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 14px;color:var(--accent)}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.plan{border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;background:#0d1320}
.plan .p{font-size:24px;font-weight:700}
.plan .q{color:var(--muted);font-size:13px}
.plan .tag{display:inline-block;margin-top:6px;font-size:12px;color:#0a0e17;background:var(--accent);border-radius:999px;padding:1px 8px}
.plan.hot{border-color:var(--accent)}
.qr{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.qr figure{margin:0;text-align:center;border:1px dashed var(--line);border-radius:12px;padding:14px}
.qr img{width:180px;height:180px;object-fit:contain;background:#fff;border-radius:8px}
.qr .missing{width:180px;height:180px;margin:0 auto;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:8px;background:#0d1320}
.qr figcaption{margin-top:8px;color:var(--muted)}
ol{margin:0;padding-left:20px}
ol li{margin:6px 0}
.note{color:var(--muted);font-size:13px}
code{background:#0d1320;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
</style>
</head>

<h1>购买额度</h1>
<p class="sub">按官方价计费，1 美元额度 = ¥10。充得越多，送得越多。</p>

<div class="card">
<h2>套餐</h2>

<div class="plan"><div class="p">¥10</div><div class="q">$1 额度</div><span class="tag">体验</span></div>
<div class="plan"><div class="p">¥50</div><div class="q">$5.2 额度</div><span class="tag">送 4%</span></div>

<div class="card">
<h2>怎么到账</h2>
<ol>
<li>按套餐金额扫码付款，备注填你的灵驿用户名。</li>
<li>把付款截图发给站长（微信）。</li>
<li>收到兑换码后，打开 <b>钱包</b>，输入兑换码，点「兑换」，余额马上到账。</li>
</ol>
<p class="note">额度不过期。调用前可以在「模型广场」查看每个模型的价格。</p>
